<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Gadget Sixty Nine</title>
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-page { padding: 120px 20px 80px; min-height: 70vh; }
        .cart-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        @media (max-width: 768px) { .cart-layout { grid-template-columns: 1fr; } }
        
        .cart-items { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; }
        .cart-item { display: flex; align-items: center; gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-img { width: 80px; height: 80px; object-fit: contain; background: #f5f5f7; border-radius: 8px; padding: 10px; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; color: var(--text-primary); }
        .cart-item-price { color: var(--primary-accent); font-weight: 600; }
        
        .qty-controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .qty-btn { width: 30px; height: 30px; border-radius: 5px; border: 1px solid var(--border-color); background: var(--bg-color); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { border-color: var(--primary-accent); color: var(--primary-accent); }
        
        .remove-btn { color: #ef4444; background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.9rem; margin-top: 10px; }
        
        .cart-summary { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; height: fit-content; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-secondary); }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); font-weight: 700; font-size: 1.2rem; color: var(--text-primary); }
        
        .empty-cart { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
        .empty-cart i { font-size: 4rem; margin-bottom: 20px; color: var(--border-color); }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="header">
        <div class="container header-content">
            <a href="index.html" class="logo">Gadget<span>Sixty Nine</span></a>
            <div class="header-actions">
                <a href="index.html" class="nav-links" style="color:var(--text-secondary)">Continue Shopping</a>
                <button class="btn-icon" id="theme-toggle" title="Toggle Dark/Light Mode"><i class="ph ph-moon"></i></button>
                <a href="login.html" class="btn-icon"><i class="ph ph-user"></i></a>
            </div>
        </div>
    </header>

    <div class="container cart-page">
        <h1 class="section-title" style="text-align: left; margin-bottom: 30px;">Shopping Cart</h1>
        
        <div class="cart-layout">
            <!-- Cart Items -->
            <div class="cart-items" id="cart-container">
                <!-- Items injected by JS -->
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <h3 style="margin-bottom: 20px; font-size: 1.2rem;">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">৳ 0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="summary-total">৳ 0</span>
                </div>
                <a href="checkout.html" class="btn-primary" style="width: 100%; text-align: center; margin-top: 20px;" id="checkout-btn">Proceed to Checkout</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top:none; padding-top:0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <p>&copy; 2026 Gadget Sixty Nine. All rights reserved.</p>
                <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                    <span style="font-size: 0.8rem; color: var(--text-secondary);"><i class="ph ph-shield-check" style="color: #22c55e;"></i> 100% Authentic Products</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
