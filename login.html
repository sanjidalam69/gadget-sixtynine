<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gadget Sixty Nine</title>
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page { display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: 100px 20px; }
        .auth-container { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; width: 100%; max-width: 450px; text-align: center; }
        
        .auth-tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); }
        .auth-tab { flex: 1; padding: 10px; cursor: pointer; font-weight: 500; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all 0.3s; }
        .auth-tab.active { color: var(--primary-accent); border-bottom-color: var(--primary-accent); }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-secondary); }
        .form-control { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px; outline: none; }
        .form-control:focus { border-color: var(--primary-accent); }
        
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }
        
        #register-form { display: none; }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="header">
        <div class="container header-content">
            <a href="index.html" class="logo">Gadget<span>Sixty Nine</span></a>
            <div class="header-actions">
                <button class="btn-icon" id="theme-toggle" title="Toggle Dark/Light Mode"><i class="ph ph-moon"></i></button>
            </div>
        </div>
    </header>

    <div class="container auth-page">
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="toggleForm('login')">Login</div>
                <div class="auth-tab" id="tab-register" onclick="toggleForm('register')">Register</div>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <h2 style="margin-bottom: 20px;">Welcome Back</h2>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="l-email" class="form-control" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="l-password" class="form-control" required placeholder="••••••••">
                </div>
                <p id="login-error" class="error-msg"></p>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form">
                <h2 style="margin-bottom: 20px;">Create Account</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="r-name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="r-email" class="form-control" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="r-password" class="form-control" required placeholder="••••••••">
                </div>
                <p id="register-error" class="error-msg"></p>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Sign Up</button>
            </form>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
